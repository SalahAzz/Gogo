<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>كل سنة وإنتِ طيبة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lalezar&family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --bg: #150f2e;
      --bg-2: #2a1a52;

      --ink: #fdf3e7;
      --muted: #bfb1de;

      --flame: #ffb547;
      --pink: #ff7aa2;
      --pink-deep: #d94f7c;
      --mint: #6fe3c1;

      --paper: #fffaf0;
      --paper-ink: #3b2a4d;

      --display: "Lalezar", "Tajawal", "Segoe UI", Tahoma, sans-serif;
      --hand: "Aref Ruqaa", "Amiri", "Traditional Arabic", serif;

      --shadow:
        0 24px 60px rgba(0, 0, 0, .45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--hand);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;

      background:
        radial-gradient(
          120% 90% at 50% 100%,
          var(--bg-2) 0%,
          var(--bg) 62%
        );
    }

    button {
      font: inherit;
      color: inherit;
    }

    button,
    img {
      user-select: none;
    }

    button:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 4px;
    }

    /* =========================================================
       BACKGROUND GLOW
    ========================================================= */

    #glow {
      position: fixed;
      left: 50%;
      top: 46%;

      z-index: -1;

      width: 130vmin;
      height: 130vmin;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          closest-side,
          rgba(255, 181, 71, .34),
          rgba(255, 122, 162, .10) 55%,
          transparent 75%
        );

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    /* =========================================================
       MUSIC CONTROL
    ========================================================= */

    .music-control {
      position: fixed;

      top: calc(18px + env(safe-area-inset-top));
      left: 18px;

      z-index: 100;

      width: 48px;
      height: 48px;

      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;

      background: rgba(255,255,255,.10);
      backdrop-filter: blur(12px);

      cursor: pointer;

      display: grid;
      place-items: center;

      font-size: 20px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .music-control:hover {
      transform: scale(1.08);
      background: rgba(255,255,255,.16);
    }

    .music-control.playing {
      animation: musicPulse 1.4s ease-in-out infinite;
    }

    @keyframes musicPulse {
      0%, 100% {
        box-shadow:
          0 0 0 0 rgba(255,181,71,.0),
          0 10px 30px rgba(0,0,0,.25);
      }

      50% {
        box-shadow:
          0 0 0 8px rgba(255,181,71,.08),
          0 10px 30px rgba(0,0,0,.25);
      }
    }

    /* =========================================================
       STAGE
    ========================================================= */

    .stage {
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding:
        70px
        18px
        calc(40px + env(safe-area-inset-bottom));

      text-align: center;

      animation: stageEnter .8s ease both;
    }

    .stage[hidden] {
      display: none;
    }

    @keyframes stageEnter {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    h1 {
      font-family: var(--display);
      font-weight: 400;

      font-size: clamp(2.3rem, 9vw, 4rem);

      line-height: 1.15;

      margin: 0;
    }

    .name {
      font-family: var(--hand);
      font-weight: 700;

      font-size: clamp(1.4rem, 5vw, 2rem);

      color: var(--flame);

      margin: 8px 0 0;
    }

    .hint {
      color: var(--muted);

      font-size: 1.15rem;

      margin: 14px 0 0;

      min-height: 1.6em;

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    /* =========================================================
       BUTTON
    ========================================================= */

    .btn {
      font-family: var(--display);
      font-size: 1.25rem;

      background: var(--flame);
      color: #2a1738;

      border: 0;
      border-radius: 999px;

      padding: 12px 30px;

      cursor: pointer;

      box-shadow:
        0 6px 0 #c47f1d;

      transition:
        transform .12s ease,
        box-shadow .12s ease,
        filter .2s ease;
    }

    .btn:hover {
      filter: brightness(1.06);
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c47f1d;
    }

    /* =========================================================
       CAKE
    ========================================================= */

    #cake {
      width: min(400px, 88vw);
      height: auto;

      margin-top: 8px;

      overflow: visible;

      filter:
        drop-shadow(0 18px 35px rgba(0,0,0,.25));
    }

    .candle {
      cursor: pointer;
      transform-origin: center bottom;
    }

    .candle:hover {
      filter: brightness(1.08);
    }

    .flame-wrap {
      transition:
        transform .12s linear,
        opacity .25s ease;
    }

    .flame {
      animation:
        flicker .18s ease-in-out infinite alternate;
    }

    .candle:nth-child(2n) .flame {
      animation-duration: .23s;
    }

    .candle:nth-child(3n) .flame {
      animation-duration: .27s;
    }

    @keyframes flicker {
      from {
        transform:
          scale(1,1)
          skewX(1deg);
      }

      to {
        transform:
          scale(.92,1.08)
          skewX(-2deg);
      }
    }

    .candle .fire {
      transform-box: fill-box;

      transition:
        opacity .25s ease,
        transform .3s ease;
    }

    .candle.out .fire {
      opacity: 0;
      transform: scale(.2);
    }

    .smoke {
      fill: none;

      stroke: #d9d0ee;
      stroke-width: 3;

      stroke-linecap: round;

      opacity: 0;

      animation:
        smoke 1.9s ease-out forwards;
    }

    @keyframes smoke {
      0% {
        opacity: .75;
        transform:
          translateY(0)
          scaleY(.6);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-46px)
          scaleY(1.2);
      }
    }

    /* =========================================================
       SOUND METER
    ========================================================= */

    .meter {
      width: min(260px, 70vw);
      height: 10px;

      border-radius: 99px;

      background: rgba(255,255,255,.12);

      margin-top: 16px;

      overflow: hidden;

      box-shadow:
        inset 0 1px 3px rgba(0,0,0,.2);
    }

    .meter i {
      display: block;

      height: 100%;
      width: 0;

      background:
        linear-gradient(
          90deg,
          var(--mint),
          var(--flame)
        );

      transition:
        width .08s linear;
    }

    .meter[hidden] {
      display: none;
    }

    /* =========================================================
       CONFETTI
    ========================================================= */

    #confetti {
      position: fixed;
      inset: 0;

      z-index: 50;

      pointer-events: none;

      width: 100%;
      height: 100%;
    }

    /* =========================================================
       ENVELOPE
    ========================================================= */

    .env-wrap {
      display: flex;
      flex-direction: column;

      align-items: center;

      transition:
        opacity .5s ease,
        transform .5s ease;
    }

    .env-wrap.gone {
      opacity: 0;
      transform: translateY(30px) scale(.96);
    }

    .env {
      position: relative;

      width: min(330px, 82vw);

      aspect-ratio: 3 / 2;

      padding: 0;

      border: 0;

      background: none;

      cursor: pointer;

      perspective: 900px;

      margin-top: 60px;

      animation:
        bob 2.6s ease-in-out infinite;

      filter:
        drop-shadow(0 22px 30px rgba(0,0,0,.25));
    }

    .env.open {
      animation: none;
    }

    @keyframes bob {
      0%,100% {
        transform:
          translateY(0)
          rotate(-1deg);
      }

      50% {
        transform:
          translateY(-8px)
          rotate(1deg);
      }
    }

    .env > span {
      position: absolute;
      display: block;
    }

    .env-back {
      inset: 0;

      background: var(--pink-deep);

      border-radius: 10px;
    }

    .env-paper {
      left: 8%;
      right: 8%;
      top: 6%;
      bottom: 8%;

      background: var(--paper);

      border-radius: 6px;

      z-index: 1;

      transition:
        transform .9s cubic-bezier(.3,.8,.3,1) .35s;
    }

    .env.open .env-paper {
      transform: translateY(-46%);
    }

    .env-front {
      inset: 0;

      z-index: 2;

      background: var(--pink);

      border-radius: 10px;

      clip-path:
        polygon(
          0 0,
          50% 56%,
          100% 0,
          100% 100%,
          0 100%
        );
    }

    .env-flap {
      left: 0;
      right: 0;
      top: 0;

      height: 56%;

      z-index: 3;

      background: #f0628f;

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin: 50% 0;

      transition:
        transform .6s ease;
    }

    .env.open .env-flap {
      transform: rotateX(180deg);
    }

    .env-seal {
      left: 50%;
      top: 56%;

      z-index: 4;

      width: 46px;
      height: 46px;

      margin:
        -23px
        0
        0
        -23px;

      border-radius: 50%;

      background: var(--flame);
      color: #7a2340;

      display: grid !important;
      place-items: center;

      font-size: 22px;

      box-shadow:
        0 3px 0 #c47f1d;

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .env.open .env-seal {
      opacity: 0;
      transform: scale(.7);
    }

    /* =========================================================
       LETTER
    ========================================================= */

    .letter {
      width: min(520px, 100%);

      background: var(--paper);
      color: var(--paper-ink);

      border-radius: 10px;

      padding:
        34px
        28px
        30px;

      text-align: right;

      background-image:
        repeating-linear-gradient(
          transparent 0 47px,
          rgba(217,79,124,.16) 47px 48px
        );

      box-shadow: var(--shadow);

      animation:
        unfold .9s cubic-bezier(.2,.8,.2,1) both;

      transform-origin: 50% 0;
    }

    .letter[hidden] {
      display: none;
    }

    @keyframes unfold {
      from {
        opacity: 0;
        transform:
          scaleY(.3)
          translateY(-30px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .letter h2 {
      font-family: var(--display);
      font-weight: 400;

      font-size: 2rem;

      margin:
        0
        0
        8px;

      color: var(--pink-deep);

      line-height: 1.3;
    }

    .letter p {
      font-size: 1.4rem;

      line-height: 48px;

      margin: 0;

      opacity: 0;

      animation:
        line .9s ease forwards;
    }

    @keyframes line {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .next {
      margin-top: 26px;

      opacity: 0;

      animation:
        line .9s ease forwards;
    }

    .next[hidden] {
      display: none;
    }

    /* =========================================================
       GIFT
    ========================================================= */

    .gift {
      position: relative;

      width: 190px;
      height: 190px;

      margin: 22px auto 0;

      background: none;

      border: 0;
      padding: 0;

      cursor: pointer;

      filter:
        drop-shadow(0 20px 25px rgba(0,0,0,.3));
    }

    .gift .box {
      position: absolute;

      left: 10px;
      right: 10px;
      bottom: 0;

      height: 120px;

      border-radius:
        6px
        6px
        12px
        12px;

      background:
        linear-gradient(
          180deg,
          #58d6b0,
          #38b592
        );

      box-shadow:
        inset 0 -10px 0 rgba(0,0,0,.08);
    }

    .gift .box::after {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 50%;

      width: 26px;

      margin-left: -13px;

      background: var(--pink);
    }

    .gift .lid {
      position: absolute;

      left: 0;
      right: 0;

      top: 28px;

      height: 46px;

      border-radius: 8px;

      z-index: 2;

      background:
        linear-gradient(
          180deg,
          #86efd0,
          #5fdcb8
        );

      transition:
        transform .8s cubic-bezier(.3,1.3,.5,1),
        opacity .5s ease .5s;
    }

    .gift .lid::after {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 50%;

      width: 26px;

      margin-left: -13px;

      background: #ff93b3;
    }

    .gift .bow {
      position: absolute;

      left: 50%;
      top: -22px;

      width: 0;
      height: 0;

      z-index: 3;
    }

    .gift .bow::before,
    .gift .bow::after {
      content: "";

      position: absolute;

      top: 0;

      width: 42px;
      height: 30px;

      border:
        8px solid #ff93b3;

      border-radius: 50%;
    }

    .gift .bow::before {
      right: -3px;
      transform: rotate(-24deg);
    }

    .gift .bow::after {
      left: -3px;
      transform: rotate(24deg);
    }

    .gift.open .lid {
      transform:
        translateY(-120px)
        rotate(-16deg);

      opacity: 0;
    }

    .gift.open {
      animation: none;
    }

    .gift:not(.open) {
      animation:
        wobble 3s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 86%, 100% {
        transform: rotate(0);
      }

      90% {
        transform: rotate(-4deg);
      }

      94% {
        transform: rotate(4deg);
      }

      98% {
        transform: rotate(-2deg);
      }
    }

    /* =========================================================
       GALLERY
    ========================================================= */

    .gallery {
      width: min(760px, 100%);

      margin: 26px auto 0;

      display: grid;

      gap: 22px 14px;

      grid-template-columns:
        repeat(2, 1fr);

      padding: 6px 4px;
    }

    .gallery[hidden] {
      display: none;
    }

    @media (min-width: 620px) {
      .gallery {
        grid-template-columns:
          repeat(3, 1fr);
      }
    }

    .polaroid {
      width: 100%;

      background: #fff;

      color: var(--paper-ink);

      border: 0;

      padding:
        8px
        8px
        12px;

      cursor: pointer;

      box-shadow:
        0 10px 26px rgba(0,0,0,.4);

      transform:
        rotate(var(--r, 0deg));

      border-radius: 3px;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .polaroid:hover {
      transform:
        rotate(0deg)
        scale(1.04);

      box-shadow:
        0 18px 35px rgba(0,0,0,.45);
    }

    .polaroid .pic {
      aspect-ratio: 1 / 1;

      width: 100%;

      background: #eee;

      overflow: hidden;
    }

    .polaroid img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform .5s ease;
    }

    .polaroid:hover img {
      transform: scale(1.04);
    }

    .ph {
      width: 100%;
      height: 100%;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          hsl(var(--h) 80% 72%),
          hsl(calc(var(--h) + 40) 75% 58%)
        );
    }

    .ph svg {
      width: 34%;

      fill: none;

      stroke:
        rgba(255,255,255,.9);

      stroke-width: 1.5;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .polaroid figcaption {
      font-size: 1.05rem;

      margin-top: 8px;

      line-height: 1.4;
    }

    /* =========================================================
       CLOSING
    ========================================================= */

    .closing {
      margin: 34px 0 0;

      font-size: 1.5rem;
    }

    .closing b {
      color: var(--flame);

      font-family: var(--display);

      font-weight: 400;

      font-size: 1.9rem;

      display: block;

      margin-bottom: 4px;
    }

    .link {
      background: none;

      border: 0;

      color: var(--muted);

      text-decoration: underline;

      cursor: pointer;

      margin-top: 18px;

      font-size: 1.05rem;
    }

    /* =========================================================
       LIGHTBOX
    ========================================================= */

    .lightbox {
      position: fixed;

      inset: 0;

      z-index: 60;

      background:
        rgba(10,6,24,.90);

      display: grid;

      place-items: center;

      padding:
        20px
        calc(20px + env(safe-area-inset-right))
        20px
        calc(20px + env(safe-area-inset-left));

      animation:
        enter .25s ease both;
    }

    .lightbox[hidden] {
      display: none;
    }

    .lightbox figure {
      position: relative;

      margin: 0;

      background: #fff;

      color: var(--paper-ink);

      padding:
        12px
        12px
        16px;

      border-radius: 4px;

      width: min(480px, 92vw);

      font-size: 1.25rem;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.5);
    }

    .lightbox .pic {
      aspect-ratio: 1 / 1;

      overflow: hidden;
    }

    .lightbox img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .lightbox .ph {
      width: 100%;
      height: 100%;

      display: grid;

      place-items: center;

      background:
        linear-gradient(
          135deg,
          hsl(var(--h) 80% 72%),
          hsl(calc(var(--h) + 40) 75% 58%)
        );
    }

    .lightbox .ph svg {
      width: 26%;

      fill: none;

      stroke:
        rgba(255,255,255,.9);

      stroke-width: 1.5;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lightbox-close {
      position: absolute;

      top: -16px;
      right: -16px;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: var(--pink);

      color: white;

      cursor: pointer;

      font-size: 22px;

      display: grid;
      place-items: center;

      box-shadow:
        0 8px 20px rgba(0,0,0,.35);
    }

    .lightbox-nav {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 14px;

      margin-top: 10px;
    }

    .lightbox-nav button {
      width: 38px;
      height: 38px;

      border: 0;

      border-radius: 50%;

      background: #eee;

      color: var(--paper-ink);

      cursor: pointer;
    }

    .lightbox-counter {
      font-family: var(--display);

      font-size: .95rem;

      color: #777;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 480px) {
      .stage {
        padding-left: 14px;
        padding-right: 14px;
      }

      .letter {
        padding:
          28px
          20px
          24px;
      }

      .letter p {
        font-size: 1.22rem;
        line-height: 42px;
      }

      .env {
        margin-top: 30px;
      }

      .music-control {
        width: 44px;
        height: 44px;

        top:
          calc(
            12px +
            env(safe-area-inset-top)
          );

        left: 12px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .flame,
      .env,
      .gift:not(.open),
      .music-control.playing {
        animation: none !important;
      }

      .stage,
      .letter,
      .letter p,
      .next {
        animation-duration: .01s !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       MUSIC
  ========================================================= -->

  <audio
    id="bgMusic"
    loop
    preload="auto"
  ></audio>

  <button
    class="music-control"
    id="musicBtn"
    type="button"
    aria-label="تشغيل الموسيقى"
    title="الموسيقى"
  >
    🔇
  </button>

  <!-- =========================================================
       BACKGROUND
  ========================================================= -->

  <div id="glow"></div>

  <canvas
    id="confetti"
    aria-hidden="true"
  ></canvas>


  <!-- =========================================================
       STAGE 1 — CAKE
  ========================================================= -->

  <section
    class="stage"
    id="s-cake"
  >

    <h1>
      كل سنة وإنتِ طيبة ي هجورتي
    </h1>

    <p
      class="name"
      id="nameLine"
    ></p>

    <svg
      id="cake"
      viewBox="0 0 320 300"
      role="img"
      aria-label="تورتة عليها خمس شموع مولعة"
    >

      <defs>

        <radialGradient
          id="flameGlow"
          cx="50%"
          cy="50%"
          r="50%"
        >
          <stop
            offset="0%"
            stop-color="#ffd27a"
            stop-opacity=".85"
          />

          <stop
            offset="100%"
            stop-color="#ffb547"
            stop-opacity="0"
          />

    /* =========================================================

    async function startMusic() {

    function stopMusic() {

      "click",

    /* =========================================================
       SIMPLE SOUND EFFECTS
       Web Audio API
    ========================================================= */

    let soundCtx = null;


    function getSoundContext() {

      if (!soundCtx) {

        soundCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if (
        soundCtx.state === "suspended"
      ) {

        soundCtx.resume();

      }

      return soundCtx;

    }


    function playTone(
      frequency,
      duration = .15,
      type = "sine",
      volume = .06
    ) {

      try {

        const ctx =
          getSoundContext();

        const oscillator =
          ctx.createOscillator();

        const gain =
          ctx.createGain();

        oscillator.type =
          type;

        oscillator.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          0,
          ctx.currentTime
        );

        gain.gain.linearRampToValueAtTime(
          volume,
          ctx.currentTime + .01
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          ctx.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
          ctx.currentTime + duration
        );

      } catch (error) {

        console.log(error);

      }

    }


    function soundCandle() {

      playTone(
        420,
        .12,
        "sine",
        .04
      );

    }


    function soundEnvelope() {

      playTone(

        .12,
        "triangle",

    /* =========================================================

    /* =========================================================
       CAKE FROSTING
    ========================================================= */

    function scallop(
      x0,
      x1,
      y,
      r,
      ry1,
      ry2,
      top
    ) {

      let d =
        `M${x0},${top} H${x1} V${y}`;

      const w =
        r * 2;

      const n =
        Math.round(
          (x1 - x0) / w
        );

      for (
        let i = 0;
        i < n;
        i++
      ) {

        d +=
          ` a${r},${i % 2 ? ry2 : ry1} 0 0 1 ${-w},0`;

      }

      return d + " Z";

    }


    $("frostBottom")
      .setAttribute(
        "d",
        scallop(

          290,
          190,

    $("frostTop")

    /* =========================================================
       CANDLES
    ========================================================= */

    const candleXs = [
      108,
      134,
      160,
      186,
      212
    ];


    const candleColors = [
      "#6fe3c1",
      "#ffd27a",
      "#8fb8ff",
      "#ff93b3",
      "#c7a6ff"
    ];


    const candles = [];

    let litCount =
      candleXs.length;


    candleXs.forEach(
      (x, i) => {

        const g =
          document.createElementNS(
            NS,

        g.setAttribute(

        g.innerHTML = `

          />

          <rect
            x="${x - 5}"
            y="94"
            width="10"
            height="4"
            fill="#fff"
            opacity=".55"
          />

          <rect
            x="${x - 1}"
            y="58"
            width="2"
            height="9"

          />

          <g

              <g class="flame">

                <path

                    M0,-28
                    C8,-17
                    10,-9
                    6,-4
                    C3,0
                    -3,0
                    -6,-4
                    C-10,-9
                    -8,-17
                    0,-28Z
                  "
                  fill="#ffb547"
                />

                <path
                  d="
                    M0,-17
                    C4,-11
                    5,-7
                    3,-4
                    C1,-2
                    -1,-2
                    -3,-4
                    C-5,-7
                    -4,-11
                    0,-17Z
                  "
                  fill="#fff3c4"
                />

              </g>

            </g>

          </g>

          <rect
            x="${x - 14}"
            y="20"
            width="28"
            height="94"
            fill="transparent"
          />

        `;


        $("cake")
          .querySelector(
            "#candles"
          )

        const candle = {

          g,

          x,

          lit: true,

          wrap:
            g.querySelector(

      }
    );


    $("glow").style.opacity = 1;


    function updateGlow() {

      $("glow").style.opacity =
        .12 +
        .88 *
        (
          litCount /
          candles.length
        );

    }


    /* =========================================================
       EXTINGUISH CANDLE
    ========================================================= */

    function snuff(candle) {

      if (!candle.lit)
        return;


      candle.lit = false;

      candle.g.classList.add(
        "out"
      );

      candle.wrap.style.transform =
        "";


      litCount--;


      updateGlow();

      soundCandle();


      const smoke =
        document.createElementNS(
          NS,
          "path"
        );


      smoke.setAttribute(
        "class",
        "smoke"
      );


      smoke.setAttribute(
        "d",
        `
          M${candle.x},52
          c6,-8 -6,-14 0,-22
          s-6,-12 0,-20
        `
      );


      $("cake").appendChild(
        smoke
      );


      setTimeout(
        () =>
          smoke.remove(),
        2000
      );


      if (
        litCount === 0
      ) {

        allOut();

      }

    }


    /* =========================================================
       ALL CANDLES OUT
    ========================================================= */

    let finished = false;


    function allOut() {

      if (finished)
        return;


      finished = true;


      stopMic();


      $("micBtn").hidden =
        true;

      $("meter").hidden =
        true;


      $("cakeHint").textContent =
        "كل سنة وإنتِ طيبة ❤️";


      $("glow").style.opacity =
        ".35";


      burstConfetti();


      setTimeout(
        () => {

            "s-letter"

        reduce
          ? 600

    /* =========================================================
       MICROPHONE
    ========================================================= */

    let audioCtx;
    let stream;
    let analyser;
    let buf;

    let rafId;

    let micOn = false;

    let ambient = 0;
    let calib = 0;
    let calibN = 0;

    let blowT = 0;

    let lastSnuff = 0;
    let lastT = 0;


    $("micBtn")
      .addEventListener(
        "click",
        startMic
      );


    async function startMic() {

      if (
        micOn ||
        finished
      ) return;


      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
              }
            });


        audioCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();


        if (
          audioCtx.state ===
          "suspended"
        ) {

          await audioCtx.resume();

        }


        analyser =
          audioCtx.createAnalyser();


        analyser.fftSize =
          1024;


        audioCtx
          .createMediaStreamSource(
            stream
          )
          .connect(
            analyser
          );


        buf =
          new Float32Array(
            analyser.fftSize
          );


        micOn = true;

        calib = 0;
        calibN = 0;
        blowT = 0;

        lastT =
          performance.now();


        $("micBtn").hidden =
          true;

        $("meter").hidden =
          false;


        $("cakeHint").textContent =
          "بنسمعك... خدي نفس وانفخي على الميكروفون 💨";


        loop();

      } catch (error) {

        console.log(error);


        $("cakeHint").textContent =
          "الميكروفون مش شغال. اضغطي على كل شمعة عشان تطفيها";

      }

    }


    function stopMic() {

      micOn = false;


      cancelAnimationFrame(
        rafId
      );


      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      if (audioCtx) {

        audioCtx
          .close()
          .catch(
            () => {}
          );

      }


      candles.forEach(
        candle =>
          candle.wrap.style.transform =
            ""
      );

    }


    function loop() {

      if (!micOn)
        return;


      const now =
        performance.now();


      const dt =
        (now - lastT) / 1000;


      lastT = now;


      analyser
        .getFloatTimeDomainData(
          buf
        );


      let sum = 0;


      for (
        let i = 0;
        i < buf.length;
        i++
      ) {

        sum +=
          buf[i] *
          buf[i];

      }


      const rms =
        Math.sqrt(
          sum / buf.length
        );


      if (
        calibN < 25
      ) {

        calib += rms;

        calibN++;

        ambient =
          calib /
          calibN;

      }


      const threshold =
        Math.max(
          .05,
          ambient * 2.6 + .03
        );


      const over =
        rms > threshold;


      const strength =
        over
          ? Math.min(
              1,
              (rms - threshold) /
                .22 +
                .25
            )
          : 0;


      $("meterFill")
        .style.width =
          Math.min(
            100,
            (rms /
              (threshold * 2.2)
            ) *
              100
          ) +
          "%";


      blowT =
        over
          ? blowT + dt
          : Math.max(
              0,
              blowT - dt * 2
            );


      candles.forEach(
        candle => {

          if (
            candle.lit
          ) {

            candle.wrap.style.transform =
              `
                rotate(${strength * 38}deg)
                scaleY(${1 - strength * .3})
              `;

          }

        }
      );


      if (
        blowT > .35 &&
        now - lastSnuff > 170
      ) {

        const next =
          candles.find(
            candle =>
              candle.lit
          );


        if (next) {

          snuff(next);

          lastSnuff =
            now;

        }

      }


      rafId =
        requestAnimationFrame(
          loop
        );

    }


    /* =========================================================
       CONFETTI
    ========================================================= */

    function burstConfetti() {

      if (reduce)
        return;


      const canvas =
        $("confetti");


      const ctx =
        canvas.getContext(
          "2d"
        );


      const dpr =
        window.devicePixelRatio ||
        1;


      canvas.width =
        innerWidth * dpr;


      canvas.height =
        innerHeight * dpr;


      ctx.scale(
        dpr,
        dpr
      );


      const colors = [
        "#ffb547",
        "#ff7aa2",
        "#6fe3c1",
        "#8fb8ff",
        "#c7a6ff",
        "#fff3c4"
      ];


      const particles =
        Array.from(
          {
            length: 180
          },
          () => ({

            x:
              innerWidth / 2 +
              (Math.random() - .5) *
                120,

            y:
              innerHeight * .5,

            vx:
              (Math.random() - .5) *
              15,

            vy:
              -(Math.random() * 13 + 5),

            w:
              Math.random() * 8 + 5,

            h:
              Math.random() * 5 + 3,

            r:
              Math.random() * 6,

            vr:
              (Math.random() - .5) *
              .4,

            c:
              colors[
                (
                  Math.random() *
                  colors.length
                ) | 0
              ]

          })
        );


      const start =
        performance.now();


      function tick(time) {

        const elapsed =
          time - start;


        ctx.clearRect(
          0,
          0,
          innerWidth,
          innerHeight
        );


        particles.forEach(
          particle => {

            particle.vy += .3;

            particle.vx *= .992;

            particle.x +=
              particle.vx;

            particle.y +=
              particle.vy;

            particle.r +=
              particle.vr;


            ctx.save();

            ctx.translate(
              particle.x,
              particle.y
            );

            ctx.rotate(
              particle.r
            );


            ctx.globalAlpha =
              Math.max(
                0,
                1 -
                  elapsed /
                    3200
              );


            ctx.fillStyle =
              particle.c;


            ctx.fillRect(
              -particle.w / 2,
              -particle.h / 2,
              particle.w,
              particle.h
            );


            ctx.restore();

          }
        );


        if (
          elapsed < 3200
        ) {

          requestAnimationFrame(
            tick
          );

        } else {

          ctx.clearRect(
            0,
            0,
            innerWidth,
            innerHeight
          );

        }

      }


      requestAnimationFrame(
        tick
      );

    }


    /* =========================================================
       ENVELOPE
    ========================================================= */

    $("env")
      .addEventListener(
        "click",
        openEnvelope
      );


    function openEnvelope() {

      const env =
        $("env");


      if (
        env.classList.contains(
          "open"
        )
      ) return;


      env.classList.add(
        "open"
      );


      soundEnvelope();


      setTimeout(
        () => {

          $("envWrap")
            .classList.add(
              "gone"
            );


          setTimeout(
            () => {

              $("envWrap")
                .style.display =
                "none";


              const body =
                $("letterBody");


              body.innerHTML =
                CONFIG.letter
                  .map(
                    (text, index) => {

                      const delay =
                        reduce
                          ? 0
                          : .9 +
                            index *
                              1.1;


                      return `
                        <p
                          style="
                            animation-delay:
                            ${delay}s
                          "
                        >
                          ${esc(text)}
                        </p>
                      `;

                    }
                  )
                  .join("");


              $("letter").hidden =
                false;


              const nextButton =
                $("toGift");


              nextButton.style.animationDelay =
                (
                  reduce
                    ? 0
                    : .9 +
                      CONFIG.letter.length *
                        1.1
                ) +
                "s";


              nextButton.hidden =
                false;

            },
            450
          );

        },
        reduce
          ? 300
          : 1500
      );

    }


    /* =========================================================
       GO TO GIFT
    ========================================================= */

    $("toGift")
      .addEventListener(
        "click",
        () => {

          soundGift();

          show(
            "s-gift"
          );

        }
      );


    /* =========================================================
       GALLERY
    ========================================================= */

    const hues = [
      335,
      265,
      165,
      35,
      210,
      300
    ];


    const cameraIcon = `
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="
            M4 8h3l1.5-2h7L17 8h3v11H4z
          "
        />

        <circle
          cx="12"
          cy="13"
          r="3.5"
        />
      </svg>
    `;


    function picHTML(
      photo,
      index
    ) {

      if (photo.src) {

        return `
          <img
            src="${esc(photo.src)}"
            alt="${esc(photo.caption)}"
            loading="lazy"
          >
        `;

      }


      return `
        <div
          class="ph"
          style="--h:${hues[
            index % hues.length
          ]}"
        >
          ${cameraIcon}
        </div>
      `;

    }


    /* =========================================================
       OPEN GIFT
    ========================================================= */

    $("gift")
      .addEventListener(
        "click",
        openGift
      );


    function openGift() {

      const gift =
        $("gift");


      if (
        gift.classList.contains(
          "open"
        )
      ) return;


      gift.classList.add(
        "open"
      );


      soundGift();


      $("giftTitle").textContent =
        "ذكرياتنا ❤️";


      const gallery =
        $("gallery");


      gallery.innerHTML =
        CONFIG.photos
          .map(
            (photo, index) => {

              const rotation =
                ((index * 37) % 9) - 4;


              return `
                <figure
                  style="
                    margin:0
                  "
                >

                  <button
                    class="polaroid"
                    data-i="${index}"
                    style="
                      --r:${rotation}deg
                    "
                    type="button"
                    aria-label="
                      كبّري الصورة:
                      ${esc(photo.caption)}
                    "
                  >

                    <div class="pic">
                      ${picHTML(
                        photo,
                        index
                      )}
                    </div>

                    <figcaption>
                      ${esc(
                        photo.caption
                      )}
                    </figcaption>

                  </button>

                </figure>
              `;

            }
          )
          .join("");


      setTimeout(
        () => {

          gallery.hidden =
            false;


          const origin =
            gift.getBoundingClientRect();


          const ox =
            origin.left +
            origin.width / 2;


          const oy =
            origin.top + 40;


          gallery
            .querySelectorAll(
              ".polaroid"
            )
            .forEach(
              (element, index) => {

                const rect =
                  element.getBoundingClientRect();


                const dx =
                  ox -
                  (
                    rect.left +
                    rect.width / 2
                  );


                const dy =
                  oy -
                  (
                    rect.top +
                    rect.height / 2
                  );


                const rotation =
                  parseFloat(
                    element.style
                      .getPropertyValue(
                        "--r"
                      )
                  );


                if (reduce)
                  return;


                element.animate(
                  [
                    {
                      transform:
                        `
                        translate(
                          ${dx}px,
                          ${dy}px
                        )
                        scale(.12)
                        rotate(
                          ${rotation - 40}deg
                        )
                        `,
                      opacity: 0
                    },

                    {
                      opacity: 1,
                      offset: .25
                    },

                    {
                      transform:
                        `
                        translate(0,0)
                        scale(1)
                        rotate(
                          ${rotation}deg
                        )
                        `,
                      opacity: 1
                    }
                  ],
                  {
                    duration: 1200,

                    delay:
                      index * 170,

                    easing:
                      "cubic-bezier(.2,.9,.3,1.15)",

                    fill:
                      "backwards"
                  }
                );

              }
            );


          const total =
            reduce
              ? 0
              : CONFIG.photos.length *
                  170 +
                1200;


          setTimeout(
            () => {

              $("closing").hidden =
                false;

              $("again").hidden =
                false;

            },
            total
          );

        },
        reduce
          ? 100
          : 650
      );

    }


    /* =========================================================
       LIGHTBOX
    ========================================================= */

    let currentPhoto =
      0;


    function renderLightbox(
      index
    ) {

      const photo =
        CONFIG.photos[index];


      currentPhoto =
        index;


      const lightbox =
        $("lightbox");


      lightbox.innerHTML = `

        <figure>

          <button
            class="lightbox-close"
            type="button"
            aria-label="إغلاق"
          >
            ×
          </button>

          <div class="pic">

            ${picHTML(
              photo,
              index
            )}

          </div>

          <figcaption
            style="margin-top:10px"
          >
            ${esc(
              photo.caption
            )}
          </figcaption>

          <div class="lightbox-nav">

            <button
              type="button"
              data-action="prev"
              aria-label="الصورة السابقة"
            >
              →
            </button>

            <span class="lightbox-counter">
              ${index + 1}
              /
              ${CONFIG.photos.length}
            </span>

            <button
              type="button"
              data-action="next"
              aria-label="الصورة التالية"
            >
              ←
            </button>

          </div>

        </figure>

      `;


      lightbox.hidden =
        false;


      document.body.style.overflow =
        "hidden";

    }


    $("gallery")
      .addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              ".polaroid"
            );


          if (!button)
            return;


          renderLightbox(
            Number(
              button.dataset.i
            )
          );

        }
      );


    $("lightbox")
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            $("lightbox")
          ) {

            closeLightbox();

            return;

          }


          if (
            event.target.closest(
              ".lightbox-close"
            )
          ) {

            closeLightbox();

            return;

          }


          const actionButton =
            event.target.closest(
              "[data-action]"
            );


          if (!actionButton)
            return;


          const action =
            actionButton.dataset
              .action;


          if (
            action === "next"
          ) {

            currentPhoto =
              (
                currentPhoto + 1
              ) %
              CONFIG.photos.length;

          }


          if (
            action === "prev"
          ) {

            currentPhoto =
              (
                currentPhoto -
                1 +
                CONFIG.photos.length
              ) %
              CONFIG.photos.length;

          }


          renderLightbox(
            currentPhoto
          );

        }
      );


    function closeLightbox() {

      $("lightbox").hidden =
        true;

      document.body.style.overflow =
        "";

    }


    /* =========================================================
       KEYBOARD
    ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }


        if (
          $("lightbox").hidden
        ) return;


        if (
          event.key === "ArrowLeft"
        ) {

          currentPhoto =
            (
              currentPhoto + 1
            ) %
            CONFIG.photos.length;


          renderLightbox(
            currentPhoto
          );

        }


        if (
          event.key === "ArrowRight"
        ) {

          currentPhoto =
            (
              currentPhoto -
              1 +
              CONFIG.photos.length
            ) %
            CONFIG.photos.length;


          renderLightbox(
            currentPhoto
          );

        }

      }
    );


    /* =========================================================
       RESTART
    ========================================================= */

    $("again")
      .addEventListener(
        "click",
        () => {

          stopMusic();

          location.reload();

        }
      );


    /* =========================================================
       INITIAL STATE
    ========================================================= */

    show(
      "s-cake"
    );

  </script>

</body>
</html>
